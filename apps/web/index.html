<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="See Inside ML — interactive labs to see inside every machine-learning model, from linear regression to transformers."
    />
    <meta property="og:title" content="See Inside ML" />
    <meta
      property="og:description"
      content="See inside every machine-learning model: interactive visualizations from linear regression and random forests to neural networks and transformers."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>See Inside ML</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var pref =
            localStorage.getItem('sim-theme') || localStorage.getItem('nnp-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
